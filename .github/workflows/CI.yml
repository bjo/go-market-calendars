name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The weekly sync starts CI on its branch (workflow-token pull requests
  # don't trigger workflows on their own).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
      - name: Vet
        run: go vet ./...
      - name: Test (includes regeneration drift check against pandas_market_calendars)
        run: go test -count=1 -race ./... # -count=1: the drift check reads files Go cannot track
      - name: Diff report runs
        run: uv run --locked --project gen gen/diff.py
